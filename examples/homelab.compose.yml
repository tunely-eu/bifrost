name: bifrost-homelab

services:
  bifrost-homelab:
    image: ghcr.io/tunely-eu/bifrost:latest
    command: ["client"]
    depends_on:
      - home-dashboard
    environment:
      BIFROST_CLIENT_SERVER_URL: "cloud.example.com:8443"
      BIFROST_CLIENT_TARGET_ADDRESS: "home-dashboard:8080"
      BIFROST_CLIENT_TOKEN: "dev-secret"
      BIFROST_CLIENT_TLS_SERVER_NAME: "cloud.example.com"
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro

  home-dashboard:
    image: hashicorp/http-echo:1.0
    command: ["-listen", ":8080", "-text", "hello from homelab"]
