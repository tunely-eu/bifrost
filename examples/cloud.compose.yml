name: bifrost-cloud

services:
  bifrost-cloud:
    image: ghcr.io/tunely-eu/bifrost:latest
    command: ["server"]
    volumes:
      - ./clients.json:/etc/bifrost/clients.json:ro
      - ./certs/server.crt:/certs/server.crt:ro
      - ./certs/server.key:/certs/server.key:ro
      - sockets:/sockets
    ports:
      - "8443:8443"

  cloud-entrypoint:
    image: caddy:2-alpine
    depends_on:
      - bifrost-cloud
    user: "0:0"
    volumes:
      - ./caddy-example/Caddyfile:/etc/caddy/Caddyfile:ro
      - sockets:/sockets
    ports:
      - "8080:8080"

volumes:
  sockets:
