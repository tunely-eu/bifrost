name: Feature Request
description: Suggest an improvement or new capability.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What use case should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What alternatives or workarounds have you considered?
  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility
      description: Note any impact on config, protocol, hooks, Docker, or existing deployments.
