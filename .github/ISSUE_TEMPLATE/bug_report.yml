name: Bug Report
description: Report a reproducible problem in Bifrost.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Please do not report security vulnerabilities here. Use the process in SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps To Reproduce
      description: Include commands, config snippets, and logs when useful. Redact secrets.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Go version, Docker version, Bifrost commit or version.
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
